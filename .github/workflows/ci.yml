# .github/workflows/ci.yml
#
# Corre em cada push e em cada pull request para main.
# Dois jobs independentes (backend e frontend), para o feedback ser mais
# rapido e para se perceber logo pelo nome do job onde e que partiu.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + unit + e2e)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hopon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hopon_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-not-for-production-use
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production-use
      JWT_REFRESH_EXPIRATION: 7d
      ALLOW_TEST_VERIFY: '1'
      FRONTEND_URL: http://localhost:5173
      RESEND_FROM: onboarding@resend.dev
      VAPID_EMAIL: mailto:ci@hopon.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_URL: http://localhost:3000/api/v1
          VITE_GOOGLE_MAPS_KEY: dummy-ci-key
          VITE_MAPBOX_TOKEN: pk.dummy_ci_token
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_dummy
        run: npm run build
